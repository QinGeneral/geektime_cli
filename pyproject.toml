[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geektime-cli"
version = "1.1.0"
description = "极客时间课程下载器 CLI"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
keywords = ["geektime", "downloader", "cli", "course"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "platformdirs>=4.0.0",
    "pycryptodome>=3.20.0",
    "m3u8>=5.1.0",
    "html2text>=2024.2.26",
    "selenium>=4.18.0",
    "Pillow>=10.0.0",
    "weasyprint>=62.0",
    "markdown>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
geektime = "geektime_dl.cli.main:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["src/geektime_dl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
